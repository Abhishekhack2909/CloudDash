name: Retrieval Evaluation & Regression Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  evaluate-retrieval:
    name: Evaluate Retrieval Performance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Retrieval Benchmark & Check Baseline
        run: |
          python -m evals.run --suite retrieval --check-baseline

      - name: Upload Retrieval Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval-results
          path: evals/results/
